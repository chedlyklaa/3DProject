<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conférence Virtuelle</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      z-index: 10;
      color: white;
      font-weight: bold;
      font-size: 24px;
      background-color: rgba(28, 28, 60, 0.85);
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      max-width: 500px;
      width: 90%;
      animation: fadeIn 1s ease-out forwards;
      opacity: 0;
      transform: scale(0.8);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h2 {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #ff6347, #00ffe5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6347, #00ffe5);
      color: #141422;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 99, 71, 0.7);
      filter: brightness(1.1);
    }

    .theme-select {
      margin: 20px 0;
      padding: 12px;
      font-size: 18px;
      border-radius: 8px;
      border: 2px solid #00ffe5;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      width: 100%;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .theme-select:focus {
      outline: none;
      border-color: #ff6347;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 10px rgba(255, 99, 71, 0.5);
    }

    #threejs-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Styles ajoutés pour la caméra */
    .camera-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 300px;
      height: 200px;
      background-color: rgba(0,0,0,0.7);
      border-radius: 10px;
      border: 2px solid #00ffe5;
      z-index: 100;
      display: none;
      overflow: hidden;
    }

    .camera-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-camera {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255,0,0,0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
      z-index: 101;
    }
  </style>
</head>
<body>

  <!-- Three.js canvas (plein écran) -->
  <canvas id="threejs-canvas"></canvas>

  <!-- Contenu principal (au-dessus de l'animation) -->
  <div class="container">
    <h2>Choisissez le thème de la conférence</h2>
    <select class="theme-select" id="themeSelect">
      <option value="" selected>Sélectionner thème conférence</option>
      <option value="science">Science</option>
      <option value="technologie">Technologie</option>
      <option value="économie">Économie</option>
    </select>

    <button class="btn" id="newConferenceBtn">➕ Nouvelle conférence</button>
    <button class="btn">🔗 Rejoindre une conférence</button>
  </div>

  <!-- Overlay de caméra ajouté -->
  <div class="camera-overlay" id="cameraOverlay">
    <button class="close-camera" id="closeCamera">×</button>
    <video id="userVideo" autoplay playsinline></video>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
