<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle de Conférence Virtuelle</title>
    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/"
        }
    }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: transparent;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
        }
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 0;
            width: 100%;
        }
        button:hover {
            background: #1976D2;
        }
        button.active {
            background: #4CAF50;
        }
        select {
            width: 100%;
            padding: 5px;
            margin: 5px 0;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
        }
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .size-controls {
            display: flex;
            gap: 10px;
        }
        .size-controls input {
            width: 45%;
        }
        .participant-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .participant-info h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #00ffe5;
        }
        .participant-info p {
            margin: 5px 0;
            font-size: 14px;
        }
        .conference-id {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="participant-info">
        <h3>Information de la conférence</h3>
        <p id="participantName"></p>
        <p id="participantRole"></p>
        <div class="conference-id" id="conferenceId"></div>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <button id="toggleCamera">🎥 Activer/Désactiver Caméra</button>
        </div>
        <div class="control-group">
            <label>Sélectionner la caméra:</label>
            <select id="cameraSelect">
                <option value="">Chargement des caméras...</option>
            </select>
        </div>
        <div class="control-group">
            <label>Taille de la vidéo:</label>
            <div class="size-controls">
                <input type="range" id="videoWidth" min="50" max="150" value="100" title="Largeur">
                <input type="range" id="videoHeight" min="50" max="150" value="100" title="Hauteur">
            </div>
        </div>
        <div class="control-group">
            <label>Volume:</label>
            <input type="range" id="videoVolume" min="0" max="100" value="50" title="Volume">
        </div>
        <div class="control-group">
            <button id="mirrorVideo">🔄 Inverser la vidéo</button>
        </div>
    </div>

    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            const participantInfo = JSON.parse(localStorage.getItem('participantInfo') || '{}');
            
            if (participantInfo.name) {
                document.getElementById('participantName').textContent = `Nom: ${participantInfo.name}`;
                document.getElementById('participantRole').textContent = `Rôle: ${participantInfo.role === 'host' ? 'Hôte' : 'Participant'}`;
                document.getElementById('conferenceId').textContent = `ID: ${participantInfo.conferenceId}`;
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
